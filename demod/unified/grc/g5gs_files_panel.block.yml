id: g5gs_files_panel
label: G5 Files Panel
category: '[G5 Ground Station]'
flags:
- python
parameters:
- id: active
  label: Active at start
  dtype: bool
  default: 'True'
  hide: part
- id: gui_hint
  label: GUI Hint
  dtype: gui_hint
  hide: part
templates:
  imports: import g5gs
  make: "<%\n    win = 'self._%s_win'%id\n%>\\\ng5gs.FilesPanel(self, active=${active})\n${win} = self.${id}\n\
    ${gui_hint() % win}"
documentation: GSSE / GSUFTP counters and the received files with hash checks.
file_format: 1
